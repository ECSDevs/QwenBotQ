# QwenBotQ 配置文件示例
# 复制本文件为 config.yml 并填入实际值
# (*) 为必填项
# 可选项内有必填项的，只能整个不填或者填写所有必填项，整个不填代表关闭该模块

# ============ AI 大模型配置（可选，不填则关闭AI功能） ============
ai:
  # API 接口列表（*）
  apis:
    my_api:
      token: sk-your-api-token-here # (*)
      base: https://api.example.com/v1 # (*)

  # 模型列表（*）
  models:
    my-model:
      api_id: my_api # 对应 apis 中的 key （*）
      model_id: gpt-3.5-turbo # 模型 ID （*）
      name: Unknown # 模型显示名称
      context_length: null # 上下文长度（null为不限制）
      max_tokens: null # 最大输出 token 数（null为不限制）
      detail: "" # 模型描述
      support_images: false # 是否支持图片输入（可从 models.dev 自动补全）

  # 默认提示词配置
  default_prompts:
    # default 提示词
    default:
      prompt: "你是我的人工智能助手，请根据我的要求提供帮助。" # （*）
      temperature: 1.0
      frequency_penalty: 0.0
      presence_penalty: 0.0
      max_tokens: null # （null为继承模型配置）

    # unsafe 提示词（可选，不填则关闭；unsafe 智能体仅限私聊会话使用）
    unsafe:
      prompt: "你的自定义提示词" # （*）
      temperature: 1.0
      frequency_penalty: 0.0
      presence_penalty: 0.0
      max_tokens: null # （null为继承模型配置）

  # 工具配置
  tools:
    bocha:
      token: sk-your-bocha-token-here # (*）
      endpoint: https://api.bocha.cn/v1/web-search

  # 上下文总结阈值（0~1，相对模型 context_length；累计 token 达到该比例时自动总结并覆盖上下文）
  summarize_threshold: 0.8

  # models.dev 自动补全（可选，不填则使用默认值；仅补全未填写的字段，不覆盖已设置值）
  models_dev:
    enable: true # 是否启用自动补全
    url: https://models.dev/models.json # 数据源地址
    cache_path: downloads/models_dev.json # 本地缓存路径（运行时目录，不纳入版本管理）
    refresh_days: 7 # 缓存有效期（天）

# ============ 数据库配置 ============
database:
  uri: mongodb://127.0.0.1:27017 # 数据库地址
  name: aioBot # 数据库名

# ============ 积分 / 价格配置 ============
price:
  daily_sign_max_coins: 50 # 每日签到最大积分
  daily_sign_min_coins: 1 # 每日签到最小积分

# ============ 哔哩哔哩动态订阅配置（可选，不填则关闭） ============
focus:
  sessdata: your-bilibili-sessdata # (*)
  subscribes: # (*)
    - uid: "12345678" # (*)
      groups:
        - "群号1"
        - "群号2"
      users:
        - "用户QQ号"
  interval:
    hours: 1 # 轮询间隔

# ============ 抽奖配置 ============
lottery:
  groups: # 开启抽奖的群号
    - "123456789"
  ticket_price: 200 # 每注价格
  reward_per_match: 200 # 每匹配一位的奖励

# ============ 21点游戏配置 ============
blackjack:
  groups: [] # 开启21点的群号列表（空列表表示所有会话都可玩）
  min_bet: 10 # 最低押注积分
  lobby_timeout: 300 # 大厅超时未开始/对局超时无行动的秒数，超时自动退款/结算

# ============ 文件服务器配置（供 OneBot/QQ 端拉取文件） ============
fileserver:
  file_server_port: 9080 # 文件服务器本地绑定端口
  remote_host: host.docker.internal # OneBot 端可访问的主机（跨机器需改为公网/可路由地址）
  remote_port: null # 远程端口（可选，默认同 file_server_port）

# ============ 图片搜索配置 ============
imagesearch:
  exhentai_cookies: null # ExHentai Cookies（可选，不填则无法搜索ExHentai）
