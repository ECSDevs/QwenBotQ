[tool.poetry]
name = "qwenbotq"
version = "0.1.0"
description = "A smart QQ bot based on Nonebot2 and Onebot v11."
authors = ["originalFactor"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10, <3.14"
nonebot2 = "^2.4.2"
nonebot-adapter-onebot = "^2.4.6"
motor = "^3.7.1"
beanie = "^1.30.0"
nonebot-plugin-apscheduler = "^0.5.0"
openai = ">=2.6.1,<4.0.0"
truststore = "^0.10.4"
nonebot-plugin-alconna = ">=0.53.0"
pillow = ">=11.1,<13.0"
py7zr = "^1.1.0"
ehentaix = { path = "EHentaiX", develop = true }
pytimeparse2 = "^1.7.1"
aiohttp = "^3.13.5"
nonesafe-ex = "^0.1.2"
ruamel-yaml = "^0.18.6"

[tool.poetry.group.dev.dependencies]
nb-cli = "^1.4.2"
pytest = ">=8,<10"
black = "^26.1.0"
pyright = "^1.1.411"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
